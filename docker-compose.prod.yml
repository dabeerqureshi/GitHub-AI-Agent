version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: github-ai-workspace-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///storage/github_agent.db
      - WORKSPACE_DIR=storage/workspaces
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - DEFAULT_AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RATE_LIMIT_PER_MINUTE=120
      - REQUIRE_APPROVAL_FOR_MUTATIONS=true
    volumes:
      - workspace_data:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - workspace-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: github-ai-workspace-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workspace-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M

volumes:
  workspace_data:
    driver: local

networks:
  workspace-net:
    driver: bridge
